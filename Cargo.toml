[package]
name = "netcheck"
version = "0.1.0"
edition = "2021"
description = "Per-app internet usage daemon"

[[bin]]
name = "netcheck"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
